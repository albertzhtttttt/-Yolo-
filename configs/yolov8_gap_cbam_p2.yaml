# Ultralytics YOLOv8 + CBAM 自定义检测结构
# 路径：configs/yolov8_gap_cbam_p2.yaml
#
# 设计说明：
#   1. 以 YOLOv8 P2 检测头思路为参考，在主干与颈部关键尺度特征后串联 CBAM；
#   2. CBAM 采用“通道注意力 → 空间注意力”的顺序结构，符合文档中更优的串联方式；
#   3. 保持 YOLOv8n 的轻量级宽深比，减少对现有训练流程的侵入。

nc: 1
scales:
  n: [0.33, 0.25, 1024]

backbone:
  # [from, repeats, module, args]
  - [-1, 1, Conv, [64, 3, 2]]
  - [-1, 1, Conv, [128, 3, 2]]
  - [-1, 3, C2f, [128, True]]
  - [-1, 1, CBAM, [128, 7]]
  - [-1, 1, Conv, [256, 3, 2]]
  - [-1, 6, C2f, [256, True]]
  - [-1, 1, CBAM, [256, 7]]
  - [-1, 1, Conv, [512, 3, 2]]
  - [-1, 6, C2f, [512, True]]
  - [-1, 1, CBAM, [512, 7]]
  - [-1, 1, Conv, [1024, 3, 2]]
  - [-1, 3, C2f, [1024, True]]
  - [-1, 1, CBAM, [1024, 7]]
  - [-1, 1, SPPF, [1024, 5]]

head:
  - [-1, 1, nn.Upsample, [None, 2, nearest]]
  - [[-1, 9], 1, Concat, [1]]
  - [-1, 3, C2f, [512]]
  - [-1, 1, CBAM, [512, 7]]

  - [-1, 1, nn.Upsample, [None, 2, nearest]]
  - [[-1, 6], 1, Concat, [1]]
  - [-1, 3, C2f, [256]]
  - [-1, 1, CBAM, [256, 7]]

  - [-1, 1, Conv, [256, 3, 2]]
  - [[-1, 17], 1, Concat, [1]]
  - [-1, 3, C2f, [512]]
  - [-1, 1, CBAM, [512, 7]]

  - [-1, 1, Conv, [512, 3, 2]]
  - [[-1, 13], 1, Concat, [1]]
  - [-1, 3, C2f, [1024]]
  - [-1, 1, CBAM, [1024, 7]]

  - [[21, 25, 29], 1, Detect, [nc]]
