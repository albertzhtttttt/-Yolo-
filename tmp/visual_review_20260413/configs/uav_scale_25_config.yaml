data:
  orig_images: data/orig_data/uav/images
  orig_labels: data/orig_data/uav/labels
  output_dir: data/resolution_datasets_uav/scale_25
  dataset_yaml: data/resolution_datasets_uav/scale_25/dataset.yaml
preprocess:
  target_size: 640
  stride: 320
  interpolation: bilinear
  min_bbox_area: 0.0001
  min_bbox_visibility: 0.3
  neg_sample_ratio: 0.1
split:
  train_ratio: 0.7
  val_ratio: 0.15
  test_ratio: 0.15
  seed: 42
augmentation:
  enabled: true
  augment_factor: 5
  flip_horizontal: true
  flip_vertical: true
  rotate_90: true
  scale_range:
  - 0.8
  - 1.2
  hsv_hue: 0.015
  hsv_saturation: 0.7
  hsv_value: 0.4
  gaussian_noise: true
  gaussian_noise_std: 10
  random_blur: true
  blur_kernel_range:
  - 3
  - 5
  mosaic: true
  mosaic_prob: 0.5
train:
  model: configs/yolov8_gap_cbam_p2.yaml
  base_model: yolov8n
  pretrained_weights: yolov8n.pt
  imgsz: 640
  epochs: 150
  batch: 16
  lr0: 0.01
  lrf: 0.01
  momentum: 0.937
  weight_decay: 0.0005
  warmup_epochs: 3
  optimizer: SGD
  patience: 50
  seed: 42
  pretrained: true
  device: '0'
  workers: 4
  save_dir: runs/uav/yolov8
  project_name: uav_yolov8_cbam
classes:
  nc: 1
  names:
  - gap
evaluate:
  conf_thres: 0.25
  iou_thres: 0.45
